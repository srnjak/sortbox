name: Build and Publish

on:
  push:
    branches:
      # '*' does not match a '/', so feature branches would never be built.
      - '**'  # All branches, including those with a slash
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: srnjak/ci-builder-maven:3.9.6-jdk21-9
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: /root/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn -B package -s mvn-settings.xml

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-jars
          path: target/*.jar

  deploy-snapshot:
    needs: build
    name: Deploy Snapshot
    runs-on: ubuntu-latest
    # master carries the SNAPSHOT version between releases, so every push to
    # it publishes a snapshot. The release job pushes version bumps back to
    # master; those commits must not deploy again.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/master'
      && !startsWith(github.event.head_commit.message, '[release] ')
    container:
      image: srnjak/ci-builder-maven:3.9.6-jdk21-9
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up environment variables
        run: |
          echo 'CENTRAL_USERNAME_PARAM=${{ vars.CENTRAL_USERNAME_PARAM }}' >> $GITHUB_ENV
          echo 'CENTRAL_PASSWORD_PARAM=${{ secrets.CENTRAL_PASSWORD_PARAM }}' >> $GITHUB_ENV

      - name: Import GPG key
        run: echo ${{ secrets.GPG_PRIVATE_KEY }} | base64 --decode | gpg --batch --import

      - name: Deploy with Maven
        run: mvn -B deploy -s mvn-settings.xml -DskipTests -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"

  release:
    needs: build
    name: Release
    runs-on: ubuntu-latest
    # Releases are started by hand from master. This repository has no
    # develop branch and no release branches, so there is no push event that
    # could stand for "this commit is a release".
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    container:
      image: srnjak/ci-builder-maven:3.9.6-jdk21-9
    permissions:
      contents: write  # Push the version bump commits and the release tag.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensures full history for tagging

      - name: Set up environment variables
        run: |
          echo 'CENTRAL_USERNAME_PARAM=${{ vars.CENTRAL_USERNAME_PARAM }}' >> $GITHUB_ENV
          echo 'CENTRAL_PASSWORD_PARAM=${{ secrets.CENTRAL_PASSWORD_PARAM }}' >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git remote set-url origin https://github.com/${{ github.repository }}.git

      - name: Import GPG key
        run: echo ${{ secrets.GPG_PRIVATE_KEY }} | base64 --decode | gpg --batch --import

      - name: Prepare release version
        run: |
          mvn -B versions:set -s mvn-settings.xml -DremoveSnapshot=true
          mvn -B scm:checkin -s mvn-settings.xml -Dmessage="[release] Release version prepared."

      - name: Publish to Maven Central
        run: mvn -B clean scm:tag deploy -s mvn-settings.xml -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"

      - name: Prepare next snapshot version
        run: |
          mvn -B versions:set -s mvn-settings.xml -DnextSnapshot=true
          mvn -B scm:checkin -s mvn-settings.xml -Dmessage="[release] New snapshot version prepared."
